spring:
  application:
    name: RKVerse

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ${DB_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  main:
    allow-circular-references: true

  data:
    web:
      pageable:
        one-indexed-parameters: true # Cho phép page bắt đầu từ 1
        default-page-size: 10
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${ACCESS_TOKEN_EXP}
  refresh-token: ${REFRESH_TOKEN_EXP}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.access: TRACE